<section class="greeting-banner">

    <h1>¡Hola, {{ firstName || 'de nuevo' }}! <span class="greeting-sub-inline">¡Qué gusto verte hoy!</span></h1>
    <p>{{ subtitle || 'Este es tu panel central.' }}</p>
  </div>
  <div class="greeting-dog-wrap">

    />
  </div>
</section>
