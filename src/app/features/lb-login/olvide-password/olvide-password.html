<section class="lb-login-section">
  <div class="lb-login-grid">

    <div class="lb-login-card-wrap">
      <div class="lb-login-card">
        <div class="lb-login-brand">
          <img class="lb-login-logo-img" src="/images/inicio/logo.png" alt="HP Constructores Generales" onerror="this.style.display='none'" />
          <h2>Recuperar contraseña</h2>
          <p>Te enviamos un enlace a tu correo para crear una nueva</p>
        </div>

        @if (!enviado) {
          <form (ngSubmit)="submit()">
            <div class="lb-field">
              <label>Correo</label>
              <input type="email" name="email" [(ngModel)]="email" placeholder="tu@correo.com" required autocomplete="username" />
            </div>

            @if (error) { <p class="lb-login-error">{{ error }}</p> }

            <button type="submit" class="lb-login-btn" [disabled]="loading">
              {{ loading ? 'Enviando...' : 'Enviar enlace' }}
            </button>
          </form>
        } @else {
          <p class="lb-login-ok">
            Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña.
            Revisa tu bandeja de entrada (y spam).
          </p>
        }

        <div class="lb-login-tutoriales-wrap">
          <a routerLink="/auth/login" class="lb-login-volver">Volver al inicio de sesión</a>
        </div>
      </div>
    </div>

    <div class="lb-login-mascota-wrap">
      <img class="lb-login-mascota" src="/images/inicio/minerito-izquierda-sinfondo.png" alt="Mascota Las Bravas" />
    </div>

  </div>
</section>
